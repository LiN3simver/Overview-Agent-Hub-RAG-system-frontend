# 這個專案（Agent_Hub）的部署目標定義。
# deploy/deploy.sh（本機）與 deploy/apply.sh（伺服器）都 source 這一份 ——
# 本機 `plan` 預告的動作，就是伺服器實際會做的動作。
# 各 agent 專案共用同一套部署流程；Hub 的 deploy.sh 另提供版本檢查 check。

# ---- 伺服器 ----------------------------------------------------------------
# 範例值；實際部署時用環境變數 T_HOST / T_REMOTE 覆寫，或直接改這裡。
: "${T_HOST:=deploy@your-server}"
: "${T_REMOTE:=~/apps/agent-hub}"

# ---- compose ---------------------------------------------------------------
: "${T_SERVICE:=hub}"
: "${T_EXTRA_SERVICES:=}"

# Hub 沒有 build 前的準備動作（agentkit 正本就在這個 repo 裡）。
: "${T_PREBUILD:=}"

# ★ 對外 port 不在這裡管
#   compose 的 `0.0.0.0:${FRONTEND_PORT:-8600}:8600` 從專案目錄的 .env 與 shell 環境插值。
#   apply.sh 部署前會比對「正在跑的 port」與「這次會用的 port」，不一樣就在動容器前中止；
#   以伺服器現況為基準，不必在這裡宣告。

# ---- 「改了什麼 → 要做什麼」的判斷規則（ERE，比對 git diff --name-only）----
# 對應 Dockerfile 的 COPY：main.py / store.py / metrics.py / agentkit / static / scripts。
# ★ tests/、pytest.ini、requirements-dev.txt 刻意不在這裡：不進 image，改了不必重建。
: "${T_IMAGE_RE:=^(main\.py|store\.py|metrics\.py|agentkit/|static/|scripts/|requirements\.txt|Dockerfile)}"

# data/ 是對話紀錄（hub.db 與 backups/），在 .gitignore 裡，不會出現在部署差異中；
# 這一行只是保險。
: "${T_MOUNT_RE:=^data/}"

: "${T_COMPOSE_RE:=^docker-compose\.yml$}"
: "${T_MIGRATION_RE:=}"
: "${T_NOTE_RE:=^\.env\.example$}"

# ---- 回滾用的 image 快照 ---------------------------------------------------
# 每次 build 前把正在跑的 image 貼一個 sha 標籤，回滾就不必重 build、不必連外網
# （見 deploy/apply.sh 的 snapshot_image）。主服務與 T_EXTRA_SERVICES 整組快照、整組回滾。
# 保留幾個版本（每個 image 各自算）；標籤不佔額外空間。
: "${T_IMAGE_KEEP:=5}"

# ---- 部署後的健康檢查 ------------------------------------------------------
# Hub 沒有 /health，首頁回 200 就代表 uvicorn 起來了；下游 agent 是否在線不擋 Hub 的部署。
# port 用 `docker compose port` 現查，不要寫死或複製插值式：對不上時服務明明正常，
# 卻會健康檢查失敗而自動回滾。
if [ -z "${T_HEALTH_CMD+x}" ]; then
    T_HEALTH_CMD='curl -fsS --max-time 10 -o /dev/null -w "%{http_code}" "http://127.0.0.1:$(docker compose port hub 8600 | sed "s/.*://")/"'
fi
: "${T_HEALTH_OK_RE:=^200$}"
# Hub 很輕（沒有模型要載），起不來就是真的壞了，不用等太久。
: "${T_HEALTH_RETRIES:=12}"
: "${T_HEALTH_INTERVAL:=3}"

# ---- 跨專案連帶 ------------------------------------------------------------
# ★ agentkit 的正本在這裡，partrag 與 rfq 各自 COPY 一份進自己的 image。只部署 Hub 的話
#   那兩邊容器還是舊版，而且不會報錯（服務起得來但 /a2a/* 沒掛、Hub 顯示 offline），
#   所以命中 agentkit/ 時 deploy.sh 會問要不要一起重建。
: "${T_DEPENDENT_RE:=^agentkit/}"
: "${T_DEPENDENT_DIRS:=../partrag-agent ../rfq-agent}"
